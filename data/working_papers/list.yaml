- title: "The Manager as a Nexus of Relational Contracts"
  pdflink: "/pdf/nexus.pdf"
  coauthors: "Duoxi Li"
  note: "Last Updated: January 2025"
  abstract: >
       Why and when do managers replace markets in allocating resources? We develop a general equilibrium model of an exchange economy in which centralized monitors partly supplant anonymous matching markets in coordinating assignments between buyers and producers. In our model, managers emerge as nexuses of relational contracts to mitigate a fundamental conflict between incentive provision and flexible allocations in fluctuating environments. We find that managerial coordination strengthens relational incentives and reduces misallocation, but leads to double marginalization of incentive rents. Because of this trade-off, market participants sort into decentralized market exchange and managerial coordination. Their optimal choice depends on factors such as demand volatility, specialization needs, market size, market tightness, and market-level reputation effects. Our model provides novel insights into the equilibrium structure, boundaries, and economic impacts of firm-like organizations, explaining when and why managerial hierarchies emerge from market-based mechanisms. 


- title: "The Reallocation Effects of Domestic Outsourcing"
  pdflink: "/pdf/outsourcing.pdf"
  coauthors: "Mayara Felix"
  note: "Last Updated: August 2024"
  abstract: >
       This paper estimates the wage, employment, and reallocation effects of non-core activity outsourcing using Brazil’s unexpected 1993 court-ordered outsourcing legalization. We leverage North-South variation in pre-legalization court permissiveness and compare security guards to less affected occupations. We find that older incumbent security guards were adversely impacted through occupational layoffs, loss of firm-level wage premia, and exit from the occupation. At the same time, increased numbers of younger workers entered the formal sector and became employed at contract firms. On net, legalization increased guard employment by 5%, led by a 50% increase in employment for guards aged 18-24, and had no effect on demographically-adjusted guard wages. The observed labor reallocation effects are explained by the fact that contract firms persistently employ demographically different workers than direct employers.


- title: "Domestic Outsourcing and Employment Security"
  pdflink: "/pdf/outsourcing_dynamics.pdf"
  coauthors: "Naijia Guo and Duoxi Li"
  note: "Last Updated: February 2025"
  abstract: >
       Domestic outsourcing is known to reduce worker wages, but its effect on employment security---a key dimension of job quality---has not been studied. Using Brazil's comprehensive employee-employer data, we robustly find that outsourcing reduces exit from formal employment among cleaners and security guards during their first few years of tenure. The observed reduction in employment hazard is larger in cities with greater volatility in labor demand. Our findings are not attributable to differences in worker characteristics or changes in local market conditions. To explain the findings, we develop a search-theoretic model in which outsourcing both alters wage setting and eases reassignment across firms. The estimated model suggest that outsourcing had more positive welfare effects on workers upon job entry than implied by wage differentials alone. 
       

- title: "Money and Barter in the Field: Evidence from the Life and Death of a Digital Currency"
  pdflink: "/pdf/Bunz.pdf"
  note: "Last Updated: January 2025"
  links:
    - url: "/pdf/Bunz_slides.pdf"
      text: "Slides"
  abstract: >
    This paper presents real-world evidence for theories of money as a medium of exchange. I leverage unique transaction-level data from a Toronto-based barter community that introduced a redeemable digital currency. I use interrupted time-series designs to measure the impacts of three unexpected monetary events---a large increase in the level of token supply and subsequent partial and complete halts in redemption---on token acceptance, token velocity, and the number of barter and token-mediated transactions. My findings are best explained by a search-theoretic model in which money is essential, prices are persistently rigid, and redeemability is necessary for money circulation. 

- title: "The Economics of Currency Redemption"
  coauthors: "Baiyun Jing, Yang You, and Yulin Zhong"  
  pdflink: "/pdf/Token_Adoption.pdf"
  note: "Last Updated: March 2025"
  abstract: >
    Many currencies are backed by promises of redemption---including stablecoins, pegged currencies, bank deposits, and asset-backed securities---but it is unclear why redemption is important when redemption volumes are often low. We show in a search-theoretic model of money that redeemability can coordinate agents on a monetary equilibrium despite zero steady-state redemption volume. However, either mispricing of the redemption good or a lack of confidence can trigger a run. Moreover, with heterogeneity in agent preferences, redeemability may become both costly and necessary for money circulation. We test the predictions of our model using unique transaction-level data from a real-world used-goods trading platform, as well as novel cross-sectional and time-series variation in redeemability. The evidence leads to new insights regarding the benefits, costs, risks, and optimal design of currency redemption.   

      
- title: "Targeting Housing Assistance: Evidence from a Subsidized Sale of Public Housing in Hong Kong"
  pdflink: "/pdf/TPS.pdf"
  note: "Last Updated: March 2025"
  abstract: >
       This paper compares the targeting efficiency of subsidized ownership and rental housing programs. I leverage the staggered roll-out of Hong Kong's Tenants Purchase Scheme, which allowed 183,700 regularly means-tested public housing tenants to buy permanent occupancy rights between 1998 and 2006. Using a difference-in-difference design, I find that the switch to subsidized ownership caused average household sizes to decrease by 5 percent and average incomes to increase by 23 percent in treated estates. Average schooling of younger adult residents rose by a year, while the share of households residing with extended family and the share of married persons sharply fell. These effects are attributable to the removal of regular income tests, which altered household formation and thereby worsened the targeting of needy populations. 

- title: "Housing Expenditure and Misallocation in a Rent Regulated City"
  coauthors: "Jimmy Ho, Yulin Hong, and Zhongji Wei"  
  pdflink: "/pdf/Housing_Inequality.pdf"
  note: "Last Updated: March 2025"
  abstract: >
       We present new theory and evidence on the equilibrium effects of rent regulation. Departing from existing models, we develop a framework showing that rent regulation may generate divergent price effects on high- and low-quality unregulated units, as housing becomes misallocated across income groups. The model helps explain the recent evolution of the housing market in Hong Kong—--a global metropolis where nearly one-third of residents occupy rent-regulated public housing. Leveraging detailed population census data from 2006 to 2016, we document increasing misallocation of public housing to higher-income tenants over time. Concurrently, rent growth in lower-quality private-sector units significantly outpaced rent growth in higher-quality segments. Our analysis suggests that although rent regulation shielded incumbent public tenants from market pressures, it exacerbated affordability challenges for younger generations and migrants. 






