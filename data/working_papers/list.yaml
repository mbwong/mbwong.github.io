- title: "Money and Barter in the Field: Lessons from the Life and Death of a Digital Currency"
  pdflink: "/pdf/Bunz.pdf"
  note: "Last Updated: June 2025"
  links:
  abstract: >
        Much of the theory in monetary economics supposes that money overcomes the inefficiencies of barter, but the theory has been untested because appropriate field data were unavailable. A new transaction-level dataset from a Toronto-based barter community tests the predictions of a search-theoretic model of money. Three unexpected monetary events are analyzed: a large increase in the supply of redeemable digital currency and subsequent partial and complete halts in currency redemption. Their impacts on token prices, token acceptance, token-mediated trade, and barter trade are measured using interrupted time-series designs. The findings confirm that (1) money facilitates trade and (2) redeemability is important for money circulation, while suggesting that (3) persistent price coordination failures are possible and (4) reputation concerns help to discipline currency redemption. Models with partial acceptability and endogenous redemption dynamics are needed to better match the data. 
        
- title: "The Emergence of Managers: A Theory of Centralized Resource Allocation in Relational Contracting Markets"
  pdflink: "/pdf/nexus.pdf"
  coauthors: "Duoxi Li"
  note: "Last Updated: May 2025"
  abstract: >
       We develop a general equilibrium model in which resource-allocating managers endogenously emerge as centralized nodes in decentralized relational contracting markets. In the model, managers mitigate a fundamental conflict between incentive provision and flexible allocations. Their presence strengthens performance incentives and reduces misallocation, but leads to double marginalization of incentive rents. Because of this trade-off, market participants sort into decentralized exchange and managerial coordination. Their optimal choice depends on individual-level demand volatility and need for specialization. At the market level, managerial coordination may become more prevalent as communication frictions fall. The model provides a novel explanation for why and when centralized agents supplant decentralized markets in coordinating allocations. It sheds new light on the equilibrium structure, boundaries, and distributional effects of real-world organizations, such as professional service firms, global sourcing firms, and online platforms.

- title: "Domestic Outsourcing and Employment Security"
  pdflink: "/pdf/outsourcing_dynamics.pdf"
  coauthors: "Naijia Guo and Duoxi Li"
  note: "Last Updated: February 2025"
  book: "Revise and resubmit, Journal of Development Economics"
  abstract: >
       Domestic outsourcing is known to reduce worker wages, but its effect on employment security---a key dimension of job quality---has not been studied. Using Brazil's comprehensive employee-employer data, we robustly find that outsourcing reduces exit from formal employment among cleaners and security guards during their first few years of tenure. The observed reduction in employment hazard is larger in cities with greater volatility in labor demand. Our findings are not attributable to differences in worker characteristics or changes in local market conditions. To explain the findings, we develop a search-theoretic model in which outsourcing both alters wage setting and eases reassignment across firms. The estimated model suggest that outsourcing had more positive welfare effects on workers upon job entry than implied by wage differentials alone. 

- title: "The Reallocation Effects of Domestic Outsourcing"
  pdflink: "/pdf/outsourcing.pdf"
  coauthors: "Mayara Felix"
  note: "Last Updated: August 2024"
  abstract: >
       This paper estimates the wage, employment, and reallocation effects of non-core activity outsourcing using Brazil’s unexpected 1993 court-ordered outsourcing legalization. We leverage North-South variation in pre-legalization court permissiveness and compare security guards to less affected occupations. We find that older incumbent security guards were adversely impacted through occupational layoffs, loss of firm-level wage premia, and exit from the occupation. At the same time, increased numbers of younger workers entered the formal sector and became employed at contract firms. On net, legalization increased guard employment by 5%, led by a 50% increase in employment for guards aged 18-24, and had no effect on demographically-adjusted guard wages. The observed labor reallocation effects are explained by the fact that contract firms persistently employ demographically different workers than direct employers.

- title: "Income Tests and Targeting Efficiency in Public Housing: Evidence from Hong Kong's Tenants Purchase Scheme"
  pdflink: "/pdf/TPS.pdf"
  note: "Last Updated: June 2025"
  abstract: >
       Economists have highlighted many advantages of subsidized homeownership over subsidized rental housing, but the removal of regular income tests may hamper targeting efficiency. This paper estimates the impact of Hong Kong’s Tenants Purchase Scheme, which allowed 183,700 public housing tenants to buy permanent occupancy rights and thereby avoid regular income tests. Leveraging its staggered roll-out, I find that the scheme substantially reduced the number of subsidized units assigned to low-income populations. Average household incomes increased by 23% in treated housing estates, while average household sizes declined and household demographic composition persistently changed. The estimates are best explained by incumbent families altering co-residence patterns to obtain additional public housing units, thereby causing harm to other low-income households waiting to receive public housing. Back-of-the-envelope calculations suggest that the scheme significantly contributed to the subsequent proliferation of tiny private-sector units.
       

- title: "The Economics of Currency Redemption"
  coauthors: "Baiyun Jing, Yang You, and Yulin Zhong"  
  pdflink: "/pdf/Token_Adoption.pdf"
  note: "Last Updated: March 2025"
  abstract: >
    Many currencies are backed by promises of redemption---including stablecoins, pegged currencies, bank deposits, and asset-backed securities---but it is unclear why redemption is important when redemption volumes are often low. We show in a search-theoretic model of money that redeemability can coordinate agents on a monetary equilibrium despite zero steady-state redemption volume. However, either mispricing of the redemption good or a lack of confidence can trigger a run. Moreover, with heterogeneity in agent preferences, redeemability may become both costly and necessary for money circulation. We test the predictions of our model using unique transaction-level data from a real-world used-goods trading platform, as well as novel cross-sectional and time-series variation in redeemability. The evidence leads to new insights regarding the benefits, costs, risks, and optimal design of currency redemption. 
