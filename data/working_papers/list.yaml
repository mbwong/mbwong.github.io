works:

- title: "Domestic Outsourcing and Employment Security"
  pdflink: "/pdf/outsourcing_dynamics.pdf"
  coauthors: "Naijia Guo and Duoxi Li"
  note: "Last Updated: February 2025"
  book: "Revise and resubmit, Journal of Development Economics"
  abstract: >
       Domestic outsourcing is known to reduce worker wages, but its effect on employment security-a key dimension of job quality-has not been studied. Using Brazil's comprehensive employee-employer data, we robustly find that outsourcing reduces exit from formal employment among cleaners and security guards during their first few years of tenure. The observed reduction in employment hazard is larger in cities with greater volatility in labor demand. Our findings are not attributable to differences in worker characteristics or changes in local market conditions. To explain the findings, we develop a search-theoretic model in which outsourcing both alters wage setting and eases reassignment across firms. The estimated model suggest that outsourcing had more positive welfare effects on workers upon job entry than implied by wage differentials alone. 

- title: "The Reallocation Effects of Domestic Outsourcing"
  pdflink: "/pdf/outsourcing.pdf"
  coauthors: "Mayara Felix"
  note: "Last Updated: August 2024"
  abstract: >
       This paper estimates the wage, employment, and reallocation effects of non-core activity outsourcing using Brazil’s unexpected 1993 court-ordered outsourcing legalization. We leverage North-South variation in pre-legalization court permissiveness and compare security guards to less affected occupations. We find that older incumbent security guards were adversely impacted through occupational layoffs, loss of firm-level wage premia, and exit from the occupation. At the same time, increased numbers of younger workers entered the formal sector and became employed at contract firms. On net, legalization increased guard employment by 5%, led by a 50% increase in employment for guards aged 18-24, and had no effect on demographically-adjusted guard wages. The observed labor reallocation effects are explained by the fact that contract firms persistently employ demographically different workers than direct employers.

- title: "The Emergence of Managers in Relational Contracting Markets"
  pdflink: "/pdf/nexus.pdf"
  coauthors: "Duoxi Li"
  note: "Last Updated: August 2025"
  abstract: >
       Managers who enforce norms and allocate resources are ubiquitous. We develop repeated-game models to explain why and when managers emerge in relational contracting markets. In the models, managers mitigate a fundamental tension between incentive provision and flexible allocations, but require incentive rents, leading to endogenous sorting into organizational arrangements. Agents choose managerial coordination over decentralized exchange when their idiosyncratic demand is volatile and specialized services are needed. Managerial coordination also increases as communication frictions decline. Our models have implications for the structure, boundaries, and distributional impacts of professional service firms, global sourcing firms, and online platforms.

- title: "Money and Barter in the Field: Evidence from a Digital Currency Experiment"
  pdflink: "/pdf/Bunz.pdf"
  note: "Last Updated: August 2025"
  links:
  abstract: >
        This paper investigates how private digital currency issuance affected the exchange of used goods on a Toronto-based barter platform. Three unexpected monetary events and unique transaction-level data are used to measure causal effects. The results confirm the predictions of a search-theoretic model of money and barter: a large increase in token issuance persistently increased trade; a partial halt in redemption triggered a redemption-run and persistently reduced acceptance and trade; and a complete halt in redemption further reduced acceptance and trade. Perhaps surprisingly, the platform's breach of trust not only harmed money circulation, but also hurt barter, revealing key roles for trust and community enforcement in shaping currency system dynamics. 

- title: "Optimal Currency Redemption: Theory and Evidence from a Digital Platform"
  coauthors: "Baiyun Jing, Yang You, and Yulin Zhong"  
  pdflink: "/pdf/Token_Adoption.pdf"
  note: "Last Updated: August 2025"
  abstract: >
    Many currencies are backed by promises of redemption-including pegged currencies, asset-backed securities, and stablecoins-but little theory or evidence informs the optimal design of currency redemption policy. We study the impact of redemption policy on currency acceptance and steady-state flows using unique transaction data from a digital trading platform and a search-theoretic framework. We show that in theory, redeemability can coordinate agents on a monetary equilibrium with zero steady-state redemption costs. However, the evidence is more consistent with a heterogeneous agent model in which redeemability is both costly and necessary for money circulation. A key implication is that optimal policy may impose some degree of redemption friction. 

- title: "The Cost of Homeownership: Evidence from Subsidized Public Housing Sales in Hong Kong"
  pdflink: "/pdf/TPS.pdf"
  note: "Last Updated: August 2025"
  abstract: >
       Subsidized homeownership may benefit recipients more than subsidized rental housing. Yet regular income tests are crucial for maximizing targeting efficiency. This paper assesses the importance of regular income tests by estimating the impact of Hong Kong's Tenants Purchase Scheme, a reform that allowed 183,700 income-tested public housing tenants to buy permanent occupancy rights. Leveraging the reform's incomplete roll-out between 1998 and 2006, I find that it increased average household incomes by 23% over 15 years in treated estates. It also reduced average household sizes and persistently altered household demographic composition. The impacts are consistent with incumbent families strategically altering co-residence choices to obtain additional public housing units. Consequently, the reform undermined targeting efficiency and increased wait times for low-income households. Back-of-the-envelope calculations suggest it significantly contributed to the proliferation of tiny subdivided private-sector units.







