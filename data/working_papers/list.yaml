- title: "Promise and Perils of Redeemable Money: Evidence from a Barter Platform"
  pdflink: "/pdf/Bunz.pdf"
  note: "Last Updated: September 2026"
  book: "Revise and resubmit, Economic Journal"
  links:
    - url: "/pdf/Bunz_appendix.pdf"
      text: "Online Appendix"
    - url: "https://www.acrc.hku.hk/Case/Detail/2204"
      text: "Teaching case"
  abstract: >
        Many digital currencies are backed by promises of redemption. What happens when the promise is broken? This paper answers with transaction-level microdata and three unanticipated policy changes on a Toronto barter platform that operated a redeemable digital token. When the platform restricted and then halted redemption, token acceptance and token-mediated trade fell while the token’s posted price stayed at par. The first breach also reduced barter and cut entry of new regular users by two-thirds, as aggrieved users withdrew from the platform. The later halt of all remaining redemption, announced as a pause, provoked no comparable backlash. Before the crises, a five-fold expansion of the token supply had raised trade by 57 percent, entirely through token-mediated exchange, confirming that the token functioned as money. A search-theoretic model of redeemable money with reference-dependent participation organizes these patterns.

- title: "Domestic Outsourcing and Young-worker Entry into the Formal Sector"
  pdflink: "/pdf/outsourcing.pdf"
  coauthors: "Mayara Felix"
  note: "Last Updated: August 2026"
  links:
    - url: "/pdf/outsourcing_appendix.pdf"
      text: "Online Appendix"
    - url: "https://www.nber.org/papers/w34172"
      text: "NBER Working Paper 34172"
  abstract: >
       Contract firms often pool demand for non-core work—security, cleaning—that is thin at any one employer. We show that this pooling creates occupation-specific scale that substitutes for worker experience at hiring. In a novel pattern we document for all occupations in Brazil’s linked employer–employee data, hiring of youth who never had a formal sector job rises with employers’ occupation-specific scale. For security guards, 1990s pro-outsourcing reforms increased young-worker entry into the formal sector: a triple-differences design shows guard employment rose by 4% and hiring from unemployment or informality by 7%, reallocating employment toward younger workers at unchanged demographic-adjusted wages.

- title: "The Displacement Effects of Domestic Outsourcing"
  pdflink: "/pdf/displacement.pdf"
  coauthors: "Mayara Felix"
  note: "Last Updated: July 2026"
  links:
    - url: "/pdf/displacement_appendix.pdf"
      text: "Online Appendix"
    - url: "https://www.nber.org/papers/w35584"
      text: "NBER Working Paper 35584"
  abstract: >
       Evidence that domestic outsourcing lowers pay comes largely from on-site transfers, in which workers move to a contractor but keep the same jobs. Displacement is rarely observed: whether workers lose their jobs, where they go, how earnings evolve. In Brazil’s 1993–1994 pro-outsourcing reforms, which differentially affected security guards, such transfers were rare; firms instead used occupational layoffs, shedding their guards while keeping other workers. Displaced guards’ employment recovered within five years, but many changed occupations and wages stayed about 12% lower. Lifetime losses average 1.2 to 1.5 years of pre-layoff earnings, concentrated among workers from high-wage firms, reflecting lost premia.

- title: "Redemption Design and Digital Currency Adoption"
  coauthors: "Baiyun Jing, Yang You, and Yulin Zhong"
  pdflink: "/pdf/Token_Adoption.pdf"
  note: "Last Updated: January 2026"
  abstract: >
    Many digital currencies are backed by redemption promises, but little evidence or theory informs currency redemption policy. We study the impact of redemption policy on digital currency adoption and flows, leveraging novel geographical variation in redemption convenience and transaction data from a peer-to-peer used goods trading platform. We show in a search-theoretic framework that redeemability may induce digital currency adoption at zero steady-state cost. However, the evidence is more consistent with a heterogeneous-agent model, in which tokens flowed on average towards users who were closer to redemption opportunities and redeemability is both costly and necessary for digital money circulation. A key implication is that optimal policy may impose some degree of redemption friction.



