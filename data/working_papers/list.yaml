- title: "Domestic Outsourcing and Employment Security"
  pdflink: "/pdf/outsourcing_dynamics.pdf"
  coauthors: "Naijia Guo and Duoxi Li"
  note: "Last Updated: February 2025"
  book: "Revise and resubmit, Journal of Development Economics"
  abstract: >
       Domestic outsourcing is known to reduce worker wages, but its effect on employment security-a key dimension of job quality-has not been studied. Using Brazil's comprehensive employee-employer data, we robustly find that outsourcing reduces exit from formal employment among cleaners and security guards during their first few years of tenure. The observed reduction in employment hazard is larger in cities with greater volatility in labor demand. Our findings are not attributable to differences in worker characteristics or changes in local market conditions. To explain the findings, we develop a search-theoretic model in which outsourcing both alters wage setting and eases reassignment across firms. The estimated model suggest that outsourcing had more positive welfare effects on workers upon job entry than implied by wage differentials alone. 

- title: "Outsourcing, Labor Market Frictions, and Employment"
  pdflink: "/pdf/outsourcing.pdf"
  coauthors: "Mayara Felix"
  note: "Last Updated: August 2025"
  abstract: >
       We estimate the labor market impacts of Brazil’s 1993 outsourcing legalization using North-South variation in pre-legalization court permissiveness, and comparing security guards to less-affected occupations. We find that outsourcing legalization persistently reallocated jobs from older incumbent guards to younger entrants. Total employment of guards and their entry from informality persistently increased, while average demographic-adjusted wages remained constant. Meanwhile, a wave of occupational layoffs displaced some incumbent guards from high-wage firms. The evidence suggests that the rise of non-core activity outsourcing reduced labor market frictions, facilitated by firm-level economies of scale in human resources and spillovers to non-adopting firms. 

- title: "The Emergence of Managers in Relational Contracting Markets"
  pdflink: "/pdf/nexus.pdf"
  coauthors: "Duoxi Li"
  note: "Last Updated: August 2025"
  book: "Revise and resubmit, Economic Journal"
  abstract: >
        Why and when do resource-allocating managers emerge in relational contracting markets? In our model, managers mitigate a fundamental tension between incentive provision and flexible allocations, but require incentive rents, leading agents to endogenously sort into organizational arrangements. Agents choose managerial coordination over decentralized exchange when their demand is volatile and their needs are specialized. Managerial coordination also increases as communication frictions fall. Our model yields rich predictions regarding the equilibrium structure, boundaries, and distributional impacts of emergent organizational forms. Empirical applications include professional service firms, global sourcing firms, and online service platforms.

- title: "Promise and Perils of Platform Money: Evidence from a Barter Community"
  pdflink: "/pdf/Bunz.pdf"
  note: "Last Updated: January 2026"
  links:
    - url: "https://www.acrc.hku.hk/Case/Detail/2204"
      text: "Teaching case"
  abstract: >
        This paper analyzes the effects of platform money issuance on user trade activity using microdata from a Toronto-based barter community that introduced a redeemable platform currency and later experienced a crisis. Three unanticipated events provide exogenous variation: a five‑fold increase in token supply, a sharp restriction of redemption opportunities, and a complete halt of redemption. Using interrupted time‑series designs, I show that monetary expansion raised total trades by around 57 percent, entirely via token‑mediated trades, with barter unchanged. Restricting and then halting redemption reduced token acceptance and token‑mediated trade, with the initial restriction also lowering barter, via reductions in platform use and new user entry. The findings confirm that platform money facilitated exchange. They caution that reputational enforcement may amplify the costs of a redemption crisis. 

- title: "Redemption Design and Digital Currency Adoption"
  coauthors: "Baiyun Jing, Yang You, and Yulin Zhong"  
  pdflink: "/pdf/Token_Adoption.pdf"
  note: "Last Updated: January 2026"
  abstract: >
    Many digital currencies are backed by redemption promises, but little evidence or theory informs currency redemption policy. We study the impact of redemption policy on digital currency adoption and flows, leveraging novel geographical variation in redemption convenience and transaction data from a peer-to-peer used goods trading platform. We show in a search-theoretic framework that redeemability may induce digital currency adoption at zero steady-state cost. However, the evidence is more consistent with a heterogeneous-agent model, in which tokens flowed on average towards users who were closer to redemption opportunities and redeemability is both costly and necessary for digital money circulation. A key implication is that optimal policy may impose some degree of redemption friction. 

- title: "Subsidize Rent or Subsidize Homeownership? Evidence from a Hong Kong Experiment"
  pdflink: "/pdf/TPS.pdf"
  note: "Last Updated: January 2026"
  book: "Revise and resubmit, Regional Science and Urban Economics"
  abstract: >
       Governments often provide homeownership subsidies, but their effects may depend critically on design elements such as income tests and transfer restrictions. This paper estimates the impacts of Hong Kong's Tenants Purchase Scheme, a program that allowed 183,700 regularly income-tested public housing tenants to buy ownership rights, but restricted leasing and resale. Leveraging its incomplete roll-out between 1998 and 2006, I find that the program increased the share of ''well-off tenants'' in treated housing estates by 44 percent from 11 p.p. Further evidence suggests that incumbent households purchased units to avoid regular income tests and reconfigured co-residence among family members to obtain additional public housing units. The unintended consequence was to exacerbate hardship for excluded low-income populations.








