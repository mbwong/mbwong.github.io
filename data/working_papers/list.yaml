- title: "Relational Contracts and the Scope of Intermediary Firms"
  pdflink: "/pdf/scope.pdf"
  note: "Last Updated: July 2026"
  abstract: >
        Why do some intermediaries specialize narrowly while others operate broadly? I study this question in a model where intermediaries choose scope and employ producers they must monitor and coordinate, with all contracts sustained relationally. Broader scope deepens buyer-manager relationships but requires larger scale, diluting monitoring and raising wages. Fees are a multiplicative markup on wages, and markups are higher for infrequent buyers, so the cost of breadth falls hardest on those whose demand is most intermittent. The central prediction reverses the naive one-stop-shop intuition: a buyer whose demand is rare uses a narrow specialist even when her task needs are diversified, because a broad manager's markup grows steeply with infrequency. Scope expansion raises total output but can harm remaining specialist buyers through a pool composition externality that worsens monitoring quality.

- title: "Managerial Coordination in Decentralized Markets"
  pdflink: "/pdf/nexus.pdf"
  coauthors: "Duoxi Li"
  note: "Last Updated: July 2026"
  book: "Revise and resubmit, Economic Journal"
  abstract: >
        This paper develops a model of managerial coordination in decentralized relational contracting markets. Intermediaries aggregate fluctuating buyer demand and coordinate the assignment of producers, lengthening productive relationships and relaxing dynamic enforcement constraints. This demand-smoothing benefit must be weighed against double marginalization: intermediaries themselves require incentive rents. The trade-off endogenously sorts buyers into managerial coordination or decentralized exchange. In equilibrium, managed producers earn lower, more compressed pay with lower separation rates. The introduction of intermediaries increases trade but redistributes surplus from producers to buyers. We extend the model to show that managerial coordination promotes specialization. The framework applies to professional service firms, global sourcing intermediaries, and digital matching platforms.

- title: "Promise and Perils of Platform Money: Evidence from a Barter Community"
  pdflink: "/pdf/Bunz.pdf"
  note: "Last Updated: January 2026"
  book: "Revise and resubmit, Economic Journal"
  links:
    - url: "https://www.acrc.hku.hk/Case/Detail/2204"
      text: "Teaching case"
  abstract: >
        This paper analyzes the effects of platform money issuance on user trade activity using microdata from a Toronto-based barter community that introduced a redeemable platform currency and later experienced a crisis. Three unanticipated events provide exogenous variation: a five‑fold increase in token supply, a sharp restriction of redemption opportunities, and a complete halt of redemption. Using event study designs, I show that monetary expansion raised total trades by around 57 percent, entirely via token‑mediated trades, with barter unchanged. Restricting and then halting redemption reduced token acceptance and token‑mediated trade, with the initial restriction also lowering barter, via reductions in platform use and new user entry. The findings highlight how platform money may increase trade, but caution that reputational enforcement may amplify the costs of a redemption crisis. 

- title: "Redemption Design and Digital Currency Adoption"
  coauthors: "Baiyun Jing, Yang You, and Yulin Zhong"  
  pdflink: "/pdf/Token_Adoption.pdf"
  note: "Last Updated: January 2026"
  abstract: >
    Many digital currencies are backed by redemption promises, but little evidence or theory informs currency redemption policy. We study the impact of redemption policy on digital currency adoption and flows, leveraging novel geographical variation in redemption convenience and transaction data from a peer-to-peer used goods trading platform. We show in a search-theoretic framework that redeemability may induce digital currency adoption at zero steady-state cost. However, the evidence is more consistent with a heterogeneous-agent model, in which tokens flowed on average towards users who were closer to redemption opportunities and redeemability is both costly and necessary for digital money circulation. A key implication is that optimal policy may impose some degree of redemption friction. 

- title: "Outsourcing, Labor Market Frictions, and Employment"
  pdflink: "/pdf/outsourcing.pdf"
  coauthors: "Mayara Felix"
  note: "Last Updated: August 2025"
  abstract: >
       We estimate the labor market impacts of Brazil’s 1993 outsourcing legalization using North-South variation in pre-legalization court permissiveness, and comparing security guards to less-affected occupations. We find that outsourcing legalization persistently reallocated jobs from older incumbent guards to younger entrants. Total employment of guards and their entry from informality persistently increased, while average demographic-adjusted wages remained constant. Meanwhile, a wave of occupational layoffs displaced some incumbent guards from high-wage firms. The evidence suggests that the rise of non-core activity outsourcing reduced labor market frictions, facilitated by firm-level economies of scale in human resources and spillovers to non-adopting firms. 




