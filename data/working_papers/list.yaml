works:

- title: "Domestic Outsourcing and Employment Security"
  pdflink: "/pdf/outsourcing_dynamics.pdf"
  coauthors: "Naijia Guo and Duoxi Li"
  note: "Last Updated: February 2025"
  book: "Revise and resubmit, Journal of Development Economics"
  abstract: >
       Domestic outsourcing is known to reduce worker wages, but its effect on employment security-a key dimension of job quality-has not been studied. Using Brazil's comprehensive employee-employer data, we robustly find that outsourcing reduces exit from formal employment among cleaners and security guards during their first few years of tenure. The observed reduction in employment hazard is larger in cities with greater volatility in labor demand. Our findings are not attributable to differences in worker characteristics or changes in local market conditions. To explain the findings, we develop a search-theoretic model in which outsourcing both alters wage setting and eases reassignment across firms. The estimated model suggest that outsourcing had more positive welfare effects on workers upon job entry than implied by wage differentials alone. 

- title: "Outsourcing, Labor Market Frictions, and Employment"
  pdflink: "/pdf/outsourcing.pdf"
  coauthors: "Mayara Felix"
  note: "Last Updated: August 2025"
  abstract: >
       We estimate the labor market impacts of Brazil’s 1993 outsourcing legalization using North-South variation in pre-legalization court permissiveness, and comparing security guards to less-affected occupations. We find that outsourcing legalization persistently reallocated jobs from older incumbent guards to younger entrants. Total employment of guards and their entry from informality persistently increased, while average demographic-adjusted wages remained constant. Meanwhile, a wave of occupational layoffs displaced some incumbent guards from high-wage firms. The evidence suggests that the rise of non-core activity outsourcing reduced labor market frictions, facilitated by firm-level economies of scale in human resources and spillovers to non-adopting firms. 

- title: "The Emergence of Managers in Relational Contracting Markets"
  pdflink: "/pdf/nexus.pdf"
  coauthors: "Duoxi Li"
  note: "Last Updated: August 2025"
  abstract: >
        We develop a repeated-game model to explain when and why resource-allocating managers emerge in relational contracting markets. Managers in our model mitigate a fundamental tension between incentive provision and flexible allocations. However, they require incentive rents, leading agents to endogenously sort into organizational arrangements. Agents choose managerial coordination over decentralized exchange when their idiosyncratic demand is volatile and specialized services are needed. Managerial coordination also increases as communication frictions decline. Our model sheds light on the structure, boundaries, and distributional impacts of ascendant organizational forms. Examples include professional service firms, global sourcing firms, and online service platforms.

- title: "Money and Barter in the Field: Evidence from a Digital Currency Experiment"
  pdflink: "/pdf/Bunz.pdf"
  note: "Last Updated: August 2025"
  links:
  abstract: >
        This paper investigates how private digital currency issuance affected the exchange of used goods in a Toronto-based barter community. Three unexpected monetary events and unique transaction-level data are used to measure causal effects. The results confirm the predictions of a search-theoretic model of money and barter: a large increase in token issuance persistently increased trade; a partial halt in redemption triggered a redemption-run and persistently reduced acceptance and trade; and a complete halt in redemption further reduced acceptance and trade. Perhaps surprisingly, the platform's breach of trust not only harmed money circulation, but also hurt barter, revealing key roles for trust and community enforcement in shaping currency system dynamics. 

- title: "Optimal Currency Redemption: Theory and Evidence from a Digital Platform"
  coauthors: "Baiyun Jing, Yang You, and Yulin Zhong"  
  pdflink: "/pdf/Token_Adoption.pdf"
  note: "Last Updated: August 2025"
  abstract: >
    Many currencies are backed by promises of redemption-including historical gold-backed currencies, historical free bank notes, and emerging stablecoins-but little theory or evidence informs the optimal design of currency redemption policy. We study the impact of redemption policy on currency acceptance and steady-state flows using unique transaction data from a digital trading platform. We show in a search-theoretic framework that redeemability can coordinate agents on a monetary equilibrium with zero steady-state redemption costs. However, the evidence is more consistent with a heterogeneous agent model in which redeemability is both costly and necessary for money circulation. A key implication is that optimal policy may impose some degree of redemption friction. 

- title: "The Cost of Homeownership: Evidence from Subsidized Public Housing Sales in Hong Kong"
  pdflink: "/pdf/TPS.pdf"
  note: "Last Updated: August 2025"
  abstract: >
       Subsidized homeownership may benefit recipients more than subsidized rental housing. Yet regular income tests are crucial for maximizing targeting efficiency. This paper assesses the importance of regular income tests by estimating the impact of Hong Kong's Tenants Purchase Scheme, a reform that allowed 183,700 income-tested public housing tenants to buy permanent occupancy rights. Leveraging the reform's incomplete roll-out between 1998 and 2006, I find that it increased average household incomes by 23% over 15 years in treated estates. It also reduced average household sizes and persistently altered household demographic composition. The impacts are consistent with incumbent families strategically altering co-residence choices to obtain additional public housing units. Consequently, the reform undermined targeting efficiency and increased wait times for low-income households. Back-of-the-envelope calculations suggest it significantly contributed to the proliferation of tiny subdivided private-sector units.







