- title: "The Manager as a Nexus of Relational Contracts"
  pdflink: "/pdf/nexus.pdf"
  coauthors: "Duoxi Li"
  note: "Last Updated: January 2025"
  abstract: >
       We analyze exchange economies in which managers endogenously emerge as nexuses of relational contracts. We show that in fluctuating environments, managers function as centralized monitors that partially replace anonymous matching markets in determining assignments between buyers and producers. In equilibrium, managers redress misallocation and reduce producer rents, but they require an additional incentive rent. Buyers thus sort into decentralized exchange and managerial coordination. Their optimal choice depends on their demand volatility, need for specialized services, market tightness, market size, and the strength of reputation effects. Our theory sheds new light on the equilibrium structure, boundaries, and impacts of firm-like organizations.


- title: "The Reallocation Effects of Domestic Outsourcing"
  pdflink: "/pdf/outsourcing.pdf"
  coauthors: "Mayara Felix"
  note: "Last Updated: August 2024"
  abstract: >
       This paper estimates the wage, employment, and reallocation effects of non-core activity outsourcing using Brazil’s unexpected 1993 court-ordered outsourcing legalization. We leverage North-South variation in pre-legalization court permissiveness and compare security guards to less affected occupations. We find that older incumbent security guards were adversely impacted through occupational layoffs, loss of firm-level wage premia, and exit from the occupation. At the same time, increased numbers of younger workers entered the formal sector and became employed at contract firms. On net, legalization increased guard employment by 5%, led by a 50% increase in employment for guards aged 18-24, and had no effect on demographically-adjusted guard wages. The observed labor reallocation effects are explained by the fact that contract firms persistently employ demographically different workers than direct employers.


- title: "Domestic Outsourcing and Employment Security"
  pdflink: "/pdf/outsourcing_dynamics.pdf"
  coauthors: "Naijia Guo and Duoxi Li"
  note: "Last Updated: July 2024"
  abstract: >
       Domestic outsourcing is robustly associated with reduced exit from formal employment among cleaners and security guards in Brazil during their first few years of tenure. This difference is not explained by worker characteristics or differential exposure to labor market conditions. We explain this novel fact by developing a search-theoretic model wherein intermediary firms can reassign outsourced workers across client firms when negative productivity shocks hit. The estimated model fits observed wage differentials and hazard profiles tightly. By easing reassignment across firms, domestic outsourcing had more positive welfare effects on workers upon job entry than implied by wage differentials alone. 
       

- title: "Money and Barter in the Field: Evidence from the Life and Death of a Digital Currency"
  pdflink: "/pdf/Bunz.pdf"
  note: "Last Updated: January 2025"
  links:
    - url: "/pdf/Bunz_slides.pdf"
      text: "Slides"
  abstract: >
    This paper presents real-world evidence for theories of money as a medium of exchange. I leverage unique transaction-level data from a Toronto-based barter community that introduced a redeemable digital currency. I use interrupted time-series designs to measure the impacts of three unexpected monetary events---a large increase in the level of token supply and subsequent partial and complete halts in redemption---on token acceptance, token velocity, and the number of barter and token-mediated transactions. My findings are best explained by a search-theoretic model in which money is essential, prices are persistently rigid, and redeemability is necessary for money circulation. 

      
             
- title: "Targeting Housing Assistance with Rent Notches: Evidence from a Quasi-experiment"
  pdflink: "/pdf/TPS.pdf"
  note: "Last Updated: March 2024"
  abstract: >
       This paper studies the effects of rent notches on the household composition and average incomes of Hong Kong's public housing residents. I leverage the staggered roll-out of the Tenants Purchase Scheme between 1998 and 2006, which allowed 183,700 tenants to buy permanent occupancy rights at discounted prices and thereby removed rent notches. Difference-in-difference estimates reveal that household sizes declined by 4-5 percent in the treated estates, while average households income rose by 23 percent. The average schooling of younger adults increased by one year. These results suggest that the removal of rent notches worsened the targeting of housing assistance towards low-income populations, partly due to endogenous changes in household formation. 

