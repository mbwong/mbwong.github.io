works:

- title: "Managerial Coordination in Decentralized Markets"
  pdflink: "/pdf/nexus.pdf"
  coauthors: "Duoxi Li"
  note: "Last Updated: July 2026"
  book: "Conditionally accepted, Economic Journal"
  abstract: >
        Why do some buyers contract directly with producers, while others contract via an intermediary that coordinates assignments and monitors performance? We develop a repeated-game model in which intermediaries aggregate fluctuating demand, lengthening productive relationships and making cooperation easier to sustain. This benefit comes at the cost of double marginalization: an added layer of rents is needed to motivate the intermediary. The trade-off determines which buyers rely on an intermediary and which contract directly. In equilibrium, producers working through intermediaries earn lower, less variable pay but greater job security. Intermediaries expand trade, yet shift its gains from producers to buyers. Managerial coordination also promotes specialization. The framework sheds new light on professional service firms, global sourcing intermediaries, and digital matching platforms.

- title: "Domestic Outsourcing and Employment Security"
  pdflink: "/pdf/outsourcing_dynamics.pdf"
  coauthors: "Naijia Guo and Duoxi Li"
  book: "Journal of Development Economics, June 2026"
  abstract: >
       Domestic outsourcing is known to reduce worker wages, but its effect on employment security—a key dimension of job quality—has not been studied. Using Brazil’s comprehensive employee-employer linked data, we find that outsourcing reduces exit from formal employment among cleaners and security guards during their first few years of tenure. The observed reduction in employment hazard is larger in cities with greater volatility in labor demand. The reduction is not attributable to differences in worker characteristics or differential exposure to local labor market shocks. The estimates suggest that outsourcing had larger positive effects on the net present value of worker earnings than implied by wage differentials alone. The patterns are consistent with a search-theoretic model in which outsourcing eases reassignment across firms.

- title: "Subsidize Rent or Subsidize Homeownership? Evidence from a Hong Kong Experiment"
  pdflink: "/pdf/TPS.pdf"
  note: "Last Updated: June 2026"
  book: "Accepted, Regional Science and Urban Economics"
  abstract: >
       Governments often provide homeownership subsidies, but their effects may depend critically on institutional context. This paper estimates the impacts of Hong Kong’s Tenants Purchase Scheme, an unusual program that allowed 183,700 regularly income-tested public housing tenants to buy restricted ownership rights. Leveraging its incomplete roll-out between 1998 and 2006, I find that the program increased the share of "well-off" households in treated housing estates by 44 percent from 11 p.p. Further evidence suggests that incumbent households purchased units to avoid regular income tests and reconfigured co-residence among family members to obtain additional public housing units. The unintended consequence was to exacerbate hardship for excluded low-income populations.

- title: "Ideological Bias and Trust in Information Sources"
  pdflink: "/pdf/trust.pdf"
  coauthors: "Matthew Gentzkow and Allen T. Zhang"
  book: "American Economic Journal: Microeconomics, May 2025"
  abstract: >
       We study the role of endogenous trust in amplifying ideological bias. Agents in our model learn a sequence of states from sources whose accuracy is ex ante uncertain. Agents learn these accuracies by comparing their own reasoning about the states based on introspection or direct experience to the sources' reports. Small biases in this reasoning can cause large ideological differences in the agents' trust in information sources and their beliefs about the states, and may lead agents to become overconfident in their own reasoning. Disagreements can be similar in magnitude whether agents see only ideologically aligned sources or diverse sources.




